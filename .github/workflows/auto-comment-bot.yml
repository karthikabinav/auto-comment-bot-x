name: Auto Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: issue-thank-you-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Thank the issue contributor
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          script: |
            const message = "Thank you for your contribution!";
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue,
              per_page: 100
            });
            if (comments.some(comment =>
              comment.body === message && comment.user?.login === "github-actions[bot]"
            )) {
              core.info("The thank-you comment already exists.");
              return;
            }
            await github.rest.issues.createComment({ ...issue, body: message });
