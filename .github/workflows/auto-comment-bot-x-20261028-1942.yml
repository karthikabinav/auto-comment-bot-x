name: Auto Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: auto-comment-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  thank-contributor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add thank-you comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = "Thank you for your contribution!";
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue, per_page: 100
            });
            const alreadyThanked = comments.some(comment =>
              comment.user?.type === "Bot" && comment.body === body
            );
            if (!alreadyThanked) {
              await github.rest.issues.createComment({ ...issue, body });
            }
