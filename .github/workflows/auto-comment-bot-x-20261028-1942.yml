name: Auto Comment Bot

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to use for a manual automation test
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: auto-comment-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  thank-contributor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add thank-you comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          script: |
            const body = "Thank you for your contribution!";
            const issueNumber = Number(
              context.payload.issue?.number ?? context.payload.inputs?.issue_number
            );
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              throw new Error("A positive issue number is required.");
            }
            const issue = { ...context.repo, issue_number: issueNumber };
            const { data: target } = await github.rest.issues.get(issue);
            if (target.pull_request) {
              throw new Error("This automation only comments on issues, not pull requests.");
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue, per_page: 100
            });
            const alreadyThanked = comments.some(comment =>
              comment.user?.type === "Bot" && comment.body === body
            );
            if (!alreadyThanked) {
              await github.rest.issues.createComment({ ...issue, body });
            }
