name: Auto Comment Bot

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: auto-comment-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Thank the issue contributor
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = "Thank you for your contribution!";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const alreadyThanked = comments.some(comment =>
              comment.user?.type === "Bot" && comment.body === body
            );
            if (!alreadyThanked) {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
