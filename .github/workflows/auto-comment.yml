name: Auto Comment Bot

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to test the comment script
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: auto-comment-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  thank-contributor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add thank-you comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number ?? Number(context.payload.inputs?.issue_number);
            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) {
              throw new Error("A positive integer issue number is required.");
            }
            const body = "Thank you for your contribution!";
            const issue = { ...context.repo, issue_number: issueNumber };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue, per_page: 100
            });
            const alreadyThanked = comments.some(comment =>
              comment.user?.type === "Bot" && comment.body === body
            );
            if (!alreadyThanked) {
              await github.rest.issues.createComment({ ...issue, body });
            }
