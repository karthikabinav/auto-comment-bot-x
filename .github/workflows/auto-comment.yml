name: Auto Comment Bot

# Run this workflow every time a new issue is opened in the repository
on:
  issues:
    types: [opened]

# Allow the built-in GITHUB_TOKEN to write comments on issues
permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add thank-you comment to the new issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: 'Thank you for your contribution!'
            });
