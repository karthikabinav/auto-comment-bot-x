name: Auto Comment Bot

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to use for a manual automation test
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: auto-comment-bot-x-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Add thank-you comment safely
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rawNumber = context.eventName === "workflow_dispatch"
              ? context.payload.inputs.issue_number
              : context.issue.number;
            if (!/^[1-9][0-9]*$/.test(String(rawNumber))) {
              throw new Error("A positive issue number is required.");
            }
            const issue_number = Number(rawNumber);
            if (!Number.isSafeInteger(issue_number)) {
              throw new Error("Invalid issue number.");
            }
            const target = { ...context.repo, issue_number };
            const { data: issue } = await github.rest.issues.get(target);
            if (issue.pull_request) {
              throw new Error("This workflow only comments on issues, not pull requests.");
            }
            const body = "Thank you for your contribution!";
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...target, per_page: 100
            });
            if (comments.some(comment =>
              comment.body === body && comment.user?.login === "github-actions[bot]"
            )) {
              core.notice("The automatic thank-you comment already exists.");
              return;
            }
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                await github.rest.issues.createComment({ ...target, body });
                return;
              } catch (error) {
                const rateLimited = [403, 429].includes(error.status) &&
                  /rate limit|secondary|abuse|too quickly/i.test(error.message);
                if (!rateLimited || attempt === 2) throw error;
                const retryAfter = Math.max(60, Number(error.response?.headers?.["retry-after"]) || 60);
                if (retryAfter > 120) throw error;
                core.warning("Rate limited; waiting before retrying the comment.");
                await new Promise(resolve => setTimeout(resolve, retryAfter * 1000));
              }
            }
